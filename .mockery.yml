all: false
filename: 'mock_{{.InterfaceName | snakecase}}.go'
force-file-write: true
formatter: goimports
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: 'mocks'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  backend/service-platform/app/internal/auth/managers:
    config:
      all: true
      include-auto-generated: true
      dir: 'app/internal/auth/managers/mocks'
  backend/service-platform/app/internal/user/managers:
    config:
      all: true
      include-auto-generated: true
      dir: 'app/internal/user/managers/mocks'
  backend/service-platform/app/internal/collection/managers:
    config:
      all: true
      include-auto-generated: true
      dir: 'app/internal/collection/managers/mocks'
  backend/service-platform/app/internal/job/managers:
    config:
      all: true
      include-auto-generated: true
      dir: 'app/internal/job/managers/mocks'
