all: false
filename: 'mock_{{.InterfaceName | snakecase}}.go'
force-file-write: true
formatter: goimports
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: 'mocks'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  # Recursive: new packages under app/internal pick up mocks without editing this file.
  # Output: <interface package dir>/mocks/mock_*.go. Skips subpaths ending in /mocks.
  backend/service-platform/app/internal:
    config:
      all: true
      recursive: true
      include-auto-generated: true
      dir: '{{.InterfaceDir}}/mocks'
      exclude-subpkg-regex:
        - '.*/mocks(/|$)'
